<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granja de Oro Mini App</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: Arial, sans-serif; background: #121212; color: #fff; text-align: center; margin: 0; padding: 20px; }
        .container { max-width: 400px; margin: auto; }
        .card { background: #1e1e1e; padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
        button { background: #4CAF50; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 8px; cursor: pointer; width: 100%; margin-top: 10px; }
        button:hover { background: #45a049; }
        .stats { display: flex; justify-content: space-around; font-size: 18px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🌾 Granja de Oro</h1>
        <div class="stats">
            <div id="semillas">🌱 Semillas: 52</div>
            <div id="hojas">🍃 Hojas: 14</div>
        </div>
        
        <div class="card">
            <h3>Área de Cultivo</h3>
            <p>¡Haz clic para cosechar al instante!</p>
            <button onclick="cosechar()">🌱 Cosechar</button>
        </div>

        <div class="card">
            <h3>📊 Rendimiento en Vivo</h3>
            <canvas id="graficaRendimiento" width="300" height="150"></canvas>
        </div>
    </div>

    <script>
        let semillas = 52;
        let hojas = 14;

        function cosechar() {
            semillas += 20;
            document.getElementById('semillas').innerText = "🌱 Semillas: " + semillas;
            alert("¡Has cosechado +20 Semillas!");
            actualizarGrafica(semillas);
        }

        const ctx = document.getElementById('graficaRendimiento').getContext('2d');
        const graficaRendimiento = new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Inicio', 'Cosecha 1', 'Cosecha 2'],
                datasets: [{
                    label: 'Crecimiento de Semillas',
                    data: [10, 30, semillas],
                    borderColor: '#4CAF50',
                    backgroundColor: 'rgba(76, 175, 80, 0.2)',
                    borderWidth: 2,
                    fill: true
                }]
            },
            options: { responsive: true }
        });

        function actualizarGrafica(nuevoValor) {
            graficaRendimiento.data.labels.push('Nueva');
            graficaRendimiento.data.datasets[0].data.push(nuevoValor);
            graficaRendimiento.update();
        }
    </script>
</body>
</html>
